<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzing and Visualizing Airline Customer Sentiment and Ratings</title>
    <!-- Link to Montserrat font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Link to favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <!-- Inline CSS for styling -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            background-color: #f5f5f5;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 10px;
            text-align: center;
        }
        /* Update the vizContainer height to fix vertical display */
        #vizContainer {
            width: 100%;
            max-width: 1600px;
            height: 85vh; /* Changed from 5vh to 85vh for proper display */
            margin-top: 0px;
            padding: 0;
        }
        /* Container to align buttons horizontally */
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        button {
            background-color: #0039b3;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
            font-family: 'Montserrat', sans-serif;
        }
        button:hover {
            background-color: #000000;
            transform: scale(1.05);
        }
        button:active {
            background-color: #032369;
            transform: scale(0.98);
        }
        /* Add disabled state styling */
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        /* Loading indicator */
        #loadingIndicator {
            margin-top: 20px;
            display: none;
            color: #0039b3;
            font-weight: bold;
        }
        /* Media queries for responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 18px;
            }
            #vizContainer {
                height: 80vh;
            }
            button {
                font-size: 12px;
                padding: 5px 10px;
            }
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 16px;
            }
            #vizContainer {
                height: 75vh;
            }
            button {
                font-size: 10px;
                padding: 4px 8px;
            }
        }
    </style>
    <!-- Load Tableau API with integrity attribute for better security -->
    <script type="text/javascript" src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>
</head>
<body>
    <h1>Analyzing and Visualizing Airline Customer Sentiment and Ratings</h1>
    
    <!-- Container for buttons -->
    <div class="button-container">
        <!-- Buttons start as disabled until viz is loaded -->
        <button id="exportPDF" disabled title="Please wait for dashboard to load">Generate PDF</button>
        <button id="exportImage" disabled title="Please wait for dashboard to load">Generate Image</button>
    </div>
    
    <!-- Loading indicator -->
    <div id="loadingIndicator">Loading dashboard...</div>
    
    <!-- Visualization container -->
    <div id="vizContainer"></div>
    
    <!-- Load our app.js script after the DOM has loaded -->
    <script type="text/javascript" src="app.js"></script>
</body>
</html>
